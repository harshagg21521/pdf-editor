<div class="p-3">
  <h2 >PDFs saved for one patient</h2>

 <div class="mt-4 border">
    <p-table [value]="pdfs" stripedRows>

    <ng-template pTemplate="header">
        <tr>
            <th>Preview</th>
            <th>Form Name</th>
            <th>File Name</th>
            <th>Action</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-pdf>
        <tr>
            <td>
                <div class="pdf-thumbnail">
                    <i class="pi pi-file-pdf"></i>
                </div>
            </td>

            <td>{{ pdf.name }}</td>
            <td>{{ pdf.fileName }}</td>

            <td>
                <p-button
                    label="Open"
                    icon="pi pi-eye"
                    (onClick)="openPdf(pdf)">
                </p-button>
            </td>
        </tr>
    </ng-template>

</p-table>
 </div>
</div>
