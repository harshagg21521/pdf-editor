<div class="min-h-screen flex justify-center bg-gray-200 p-3">
  <div class="w-full max-w-xl px-4">
    <p-select
      class="w-100"
      [options]="forms"
      [(ngModel)]="selectedForm"
      optionLabel="name"
      optionValue="url"
      placeholder="Select a Form"
      [filter]="true"
      filterBy="name"
      [showClear]="true"
      (onChange)="onFormSelect($event)"
      [style]="{ 'border': '1px solid black' }"
    >
    </p-select>
  </div>
</div>
