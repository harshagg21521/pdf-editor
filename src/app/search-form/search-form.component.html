<div class="min-h-screen flex bg-gray-200 p-3">
  <div class="max-w-xl px-4">
    <p-select
      class="w-200"
      scrollHeight="400px"
      [options]="forms"
      [(ngModel)]="selectedForm"
      optionLabel="name"
      optionValue="url"
      placeholder="Select a Form"
      [filter]="true"
      filterBy="name"
      [showClear]="true"
      (onChange)="onFormSelect($event)"
      [style]="{ border: '1px solid black' }"
    >
    </p-select>
  </div>
</div>
